services:
  db:
    profiles: ["local"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: regula_agent
      POSTGRES_USER: regula
      POSTGRES_PASSWORD: regula
    ports:
      - "5432:5432"
    volumes:
      - regula_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regula -d regula_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      AGENT_PROVIDER: mock
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-regula_agent}
      POSTGRES_USER: ${POSTGRES_USER:-regula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regula}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        required: false
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      VITE_API_BASE: http://localhost:8000
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  regula_pg_data:
  frontend_node_modules:
