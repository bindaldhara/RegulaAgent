services:
  db:
    profiles: ["local"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: regula_agent
      POSTGRES_USER: regula
      POSTGRES_PASSWORD: regula
    ports:
      - "5432:5432"
    volumes:
      - regula_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regula -d regula_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      AGENT_PROVIDER: ${AGENT_PROVIDER:-auto}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-regula_agent}
      POSTGRES_USER: ${POSTGRES_USER:-regula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regula}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-regula-voice}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        required: false
    volumes:
      - ./backend:/app
      - ./datasets:/datasets

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      VITE_API_BASE: http://localhost:8000
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  voice-worker:
    build:
      context: .
      dockerfile: docker/voice.Dockerfile
    volumes:
      # Use repo code on disk (restart container after edits; avoids stale COPY cache).
      - ./voice_worker:/app
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-regula-voice}
      REGULA_BACKEND_URL: http://backend:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      VOICE_OPENAI_API_KEY: ${VOICE_OPENAI_API_KEY:-}
      VOICE_AUDIO_MODE: ${VOICE_AUDIO_MODE:-free}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VOICE_GROQ_STT_MODEL: ${VOICE_GROQ_STT_MODEL:-whisper-large-v3-turbo}
      VOICE_EDGE_TTS_VOICE: ${VOICE_EDGE_TTS_VOICE:-en-US-JennyNeural}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  regula_pg_data:
  frontend_node_modules:
